name: Verify Pife
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: bash backend/mvnw -B -f backend/pom.xml clean verify
      - run: java -jar backend/target/pife-1.0.0.jar > /tmp/pife.log 2>&1 &
      - run: for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 1; done; cat /tmp/pife.log; exit 1
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          PIFE_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker build --tag pife:ci .
      - run: docker run --detach --name pife-ci -p 8082:8080 -e PORT=8080 -e RENDER_EXTERNAL_URL=http://localhost:8082 pife:ci
      - run: for i in $(seq 1 40); do curl -fsS http://localhost:8082/api/health && exit 0; sleep 1; done; docker logs pife-ci; exit 1
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          PIFE_BASE_URL: http://localhost:8082
      - run: docker exec pife-ci java -cp /app/monitor br.edu.pife.util.SharedMemoryMonitor /app/runtime/shared/slot-000.mmap
      - run: docker logs pife-ci
        if: failure()
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: container-browser-traces
          path: frontend/test-results
      - run: docker rm -f pife-ci
        if: always()
