spring.application.name=pife-caxeta
server.port=${PORT:8080}
server.forward-headers-strategy=framework
pife.allowed-origins=${RENDER_EXTERNAL_URL:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
